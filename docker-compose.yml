version: '3.8'

services:
  # CSDL PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: verybid-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: verybid_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis dùng để làm cache và chặn spam
  redis:
    image: redis:7-alpine
    container_name: verybid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
