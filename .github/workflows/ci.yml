name: VeryBid CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Kiểm tra Backend (Spring Boot)
  build-backend:
    name: Build & Test Spring Boot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Cấp quyền chạy cho Maven Wrapper
      run: chmod +x mvnw

    - name: Đóng gói dự án (Build)
      run: ./mvnw clean package -DskipTests

    - name: Chạy kiểm thử tự động (Test)
      run: ./mvnw test

  # Job 2: Kiểm tra Frontend (Next.js)
  build-frontend:
    name: Build Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Node.js v20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Cài đặt thư viện (Dependencies)
      run: npm ci

    - name: Kiểm tra lỗi cú pháp (Lint)
      run: npm run lint

    - name: Đóng gói dự án (Build)
      run: npm run build
